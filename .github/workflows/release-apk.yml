name: Release APK

on:
  push:
    tags:
      # Semver only — must match versionName in app/build.gradle.kts (e.g. v1.3.3).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          EXPECTED="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match app/build.gradle.kts versionName ($VERSION_NAME). Expected tag $EXPECTED."
            exit 1
          fi
          echo "Tag $TAG matches versionName $VERSION_NAME"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing."
            echo "Create GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (optional: ANDROID_KEY_PASSWORD)."
            echo "See README § Signing & release. Refusing to publish an unsigned or debug APK."
            exit 1
          fi

      - name: Read versionName and versionCode
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Require Fastlane changelogs for versionCode
        run: |
          CODE="${{ steps.version.outputs.code }}"
          for LOCALE in en-US zh-CN; do
            FILE="fastlane/metadata/android/${LOCALE}/changelogs/${CODE}.txt"
            if [ ! -s "$FILE" ]; then
              echo "::error::Missing or empty changelog: $FILE (required before tagging v${{ steps.version.outputs.name }})."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager=${SDKM}"
          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" "platforms;android-36" "build-tools;35.0.0"

      - name: Install release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release asset
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          APK_NAME="easy-ledger-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          ls -la "${APK_NAME}"
          ls -la app/build/outputs/bundle/release/

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-ledger-aab-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Write release notes
        run: |
          CODE="${{ steps.version.outputs.code }}"
          {
            echo "## Easy Ledger / 轻记账 ${{ steps.version.outputs.name }}"
            echo
            echo "### English"
            cat "fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
            echo
            echo "### 中文"
            cat "fastlane/metadata/android/zh-CN/changelogs/${CODE}.txt"
            echo
            echo "---"
            echo
            echo "Signed release (\`assembleRelease\` + \`bundleRelease\`), applicationId \`com.qingjizhang.app\`. AAB attached as workflow artifact for Play upload."
          } > release_body.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Easy Ledger ${{ steps.version.outputs.name }}
          body_path: release_body.md
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true

      - name: Upload APK to Cloudflare R2 and verify CDN checksum
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          APK_NAME: ${{ env.APK_NAME }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::Skipping Cloudflare R2 upload: configure GitHub secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_ACCOUNT_ID to mirror the release APK to bucket etai-apk."
            exit 0
          fi
          if [ ! -f "$APK_NAME" ]; then
            echo "::error::Release APK not found: $APK_NAME"
            exit 1
          fi
          export AWS_DEFAULT_REGION=auto
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          aws s3 cp "$APK_NAME" "s3://etai-apk/$APK_NAME" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/vnd.android.package-archive
          LOCAL_SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          REMOTE_SHA=$(curl -fsSL "https://dl.etais.dev/$APK_NAME" | sha256sum | awk '{print $1}')
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::R2/CDN checksum mismatch for $APK_NAME"
            echo "local  $LOCAL_SHA"
            echo "remote $REMOTE_SHA"
            exit 1
          fi
          echo "R2 upload verified: https://dl.etais.dev/$APK_NAME (sha256 $LOCAL_SHA)"

      - name: Manual run note
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch validates build and signing only; no GitHub Release is created. Push semver tag vX.Y.Z to publish."
